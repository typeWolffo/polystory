<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polystory review</title>
<style>
  :root { --bg:#141418; --panel:#1d1d24; --line:#2c2c36; --text:#e8e8ee; --muted:#8c8c9c; --accent:#67e1c9; --warn:#f8792f; --bad:#ff5c5c; --pin:#ff3d7f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, "Segoe UI", Inter, sans-serif; height:100vh; display:grid; grid-template-columns:1fr 340px; grid-template-rows:48px 1fr 56px; }
  header { grid-column:1/3; display:flex; align-items:center; gap:16px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font-weight:600; }
  header .meta { color:var(--muted); }
  header .meta code { color:var(--text); }
  header .status { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .chip { padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12px; white-space:nowrap; }
  .chip.ok { border-color:var(--accent); color:var(--accent); }
  .chip.warn { border-color:var(--warn); color:var(--warn); }
  .chip.fail { border-color:var(--bad); color:var(--bad); }
  .chip.hidden { display:none; }
  #stage { position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hint { position:absolute; left:12px; bottom:12px; color:var(--muted); font-size:12px; background:rgba(20,20,24,.7); padding:6px 10px; border-radius:6px; }
  .views, .tools { position:absolute; top:12px; display:flex; gap:6px; }
  .views { left:12px; }
  .tools { right:12px; }
  .views button, .tools button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .views button:hover, .tools button:hover { border-color:var(--muted); }
  .tools button.on { border-color:var(--accent); color:var(--accent); }
  .tools button.hidden { display:none; }
  .label { position:absolute; transform:translate(-50%,-130%); background:var(--pin); color:#fff; font-weight:700; font-size:12px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .label.check { background:var(--muted); }
  .label.resolved { background:var(--accent); color:#0b2b25; }
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 16px 8px; }
  .pins { flex:1; overflow:auto; padding:0 12px; }
  .pin { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:start; }
  .pin .n { width:22px; height:22px; border-radius:50%; background:var(--pin); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .pin.check .n { background:var(--muted); }
  .pin.resolved .n { background:var(--accent); color:#0b2b25; }
  .pin textarea { width:100%; background:transparent; border:0; color:var(--text); font:inherit; resize:vertical; min-height:38px; outline:none; }
  .pin .where { color:var(--muted); font-size:11px; margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .pin .where label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  .pin .x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:16px; }
  .empty { color:var(--muted); font-size:12px; padding:4px 6px; }
  .general { padding:0 12px 12px; }
  .general textarea { width:100%; min-height:64px; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--text); font:inherit; padding:8px 10px; resize:vertical; outline:none; }
  .palette { display:flex; gap:6px; padding:0 16px 12px; flex-wrap:wrap; }
  .sw { width:22px; height:22px; border-radius:6px; border:1px solid var(--line); }
  footer { grid-column:1/3; display:flex; align-items:center; gap:10px; padding:0 16px; border-top:1px solid var(--line); background:var(--panel); }
  footer .spacer { flex:1; }
  footer button { font:inherit; padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  footer button.primary { background:var(--accent); color:#0b2b25; border-color:var(--accent); font-weight:600; }
  footer button.send { border-color:var(--pin); color:var(--pin); }
  footer button:disabled { opacity:.45; cursor:default; }
  footer .note { color:var(--muted); font-size:12px; }
  #toast { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--accent); color:var(--text); padding:8px 14px; border-radius:8px; display:none; font-size:13px; z-index:2; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
</head>
<body>
<header>
  <b>polystory review</b>
  <span class="meta" id="meta">loading…</span>
  <span class="status">
    <span class="chip" id="check">check</span>
    <span class="chip" id="stats"></span>
    <span class="chip hidden" id="building">agent is building…</span>
    <span class="chip" id="iteration">iteration</span>
  </span>
</header>
<section id="stage">
  <div class="views" id="views"></div>
  <div class="tools">
    <button id="wire">wireframe</button>
    <button id="figure">scale figure</button>
    <button id="ref" class="hidden">show reference</button>
  </div>
  <div class="hint">drag to orbit · scroll to zoom · <b>click the model to drop a pin</b></div>
  <div id="toast"></div>
</section>
<aside>
  <h2>Pins</h2>
  <div class="pins" id="pins"><div class="empty">Click the model where something is off.</div></div>
  <h2>General</h2>
  <div class="general"><textarea id="general" placeholder="Anything not tied to a point: too big overall, wrong colour, wrong vibe…"></textarea></div>
  <h2>Palette</h2>
  <div class="palette" id="palette"></div>
</aside>
<footer>
  <span class="note">Each pin carries the point, the normal, your camera and a screenshot, so the agent sees exactly what you saw.</span>
  <span class="spacer"></span>
  <button id="reject">Start over</button>
  <button class="send" id="send" disabled>Send to the agent</button>
  <button class="primary" id="accept">Accept</button>
</footer>
<script type="module" src="/dist/review.js"></script>
</body>
</html>
